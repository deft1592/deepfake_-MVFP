# Stage 1: full FREPDD + CLIP ViT-B/16 training.
# Reconstructed from artifacts/logs/stage1_all/training.log.

train_mode: all
pretrained: ./training/pretrained/clip-vit-base-patch16
model_name: frepddCg
backbone_name: clip_vit_base_patch16
backbone_train_scope: all

backbone_config:
  num_classes: 2
  image_size: 224
  dropout: 0.1
  gradient_checkpointing: false

all_dataset: [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter, DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC, DeeperForensics-1.0, UADFV]
train_dataset: [FaceForensics++]
val_dataset: [Celeb-DF-v2, Celeb-DF-v1]
test_dataset: [Celeb-DF-v2, Celeb-DF-v1]
dataset_type: blend
compression: c23
train_batchSize: 32
test_batchSize: 128
workers: 8
frame_num: {train: 8, test: 32}
resolution: 256
with_mask: false
with_landmark: false
save_ckpt: true
save_feat: false

use_data_augmentation: true
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.3
  rotate_limit: [-10, 10]
  blur_prob: 0.25
  blur_limit: [3, 7]
  brightness_limit: [-0.1, 0.1]
  contrast_limit: [-0.1, 0.1]
  color_prob: 0.4
  degradation_prob: 0.6
  scale_min: 0.5
  scale_max: 0.9
  noise_var_limit: [5.0, 30.0]
  quality_lower: 35
  quality_upper: 100
  gamma_prob: 0.15
  gamma_limit: [85, 115]
  grayscale_prob: 0.05

mean: [0.48145466, 0.4578275, 0.40821073]
std: [0.26862954, 0.26130258, 0.27577711]

optimizer:
  type: adam
  adam:
    lr: 0.0001
    lr_d: 0.0002
    lr_c: 0.000005
    beta1: 0.5
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0001
    amsgrad: false
  sgd:
    lr: 0.0002
    momentum: 0.9
    weight_decay: 0.0005
  sam:
    lr: 0.001
    momentum: 0.9

lr_scheduler: step
lr_step: 8
lr_gamma: 0.5
nEpochs: 24
start_epoch: 0
validations_per_epoch: 1
save_epoch: 1
rec_iter: 100
logdir: ./logs
manualSeed: 1024

d_update_every: 1
g_adv_weight: 1.0
g_compression_weight: 0.05
g_task_weight: 0.0
band_dropout_prob: 0.2
pert_budget: 0.02
normalize_compression_loss: true
label_smoothing: 0.05
early_stop_patience: 5
early_stop_min_delta: 0.0005

loss_func: cross_entropy
losstype: null
metric_scoring: auc
cuda: true
cudnn: true

