# Stage 2: warm-started partial CLIP fine-tuning.
# Reconstructed from artifacts/logs/stage2_cdfv1_finetune/training.log.

train_mode: task_finetune
weights_path: ./artifacts/checkpoints/stage1_best.pth
validate_before_training: true
pretrained: ./training/pretrained/clip-vit-base-patch16
model_name: frepddCg
backbone_name: clip_vit_base_patch16
backbone_train_scope: last_stage

backbone_config:
  num_classes: 2
  image_size: 224
  dropout: 0.1
  gradient_checkpointing: false

all_dataset: [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter, DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC, DeeperForensics-1.0, UADFV]
train_dataset: [FaceForensics++]
val_dataset: [Celeb-DF-v1]
test_dataset: [Celeb-DF-v1, Celeb-DF-v2]
dataset_type: blend
compression: c23
train_batchSize: 32
test_batchSize: 64
workers: 8
frame_num: {train: 8, test: 32}
resolution: 256
with_mask: false
with_landmark: false
save_ckpt: true
save_feat: false

use_data_augmentation: true
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.3
  rotate_limit: [-10, 10]
  blur_prob: 0.25
  blur_limit: [3, 7]
  brightness_limit: [-0.1, 0.1]
  contrast_limit: [-0.1, 0.1]
  color_prob: 0.4
  degradation_prob: 0.6
  scale_min: 0.5
  scale_max: 0.9
  noise_var_limit: [5.0, 30.0]
  quality_lower: 35
  quality_upper: 100
  gamma_prob: 0.15
  gamma_limit: [85, 115]
  grayscale_prob: 0.05

mean: [0.48145466, 0.4578275, 0.40821073]
std: [0.26862954, 0.26130258, 0.27577711]

optimizer:
  type: adam
  adam:
    lr: 0.0000005
    lr_d: 0.0000001
    lr_c: 0.000001
    lr_head: 0.000005
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0005
    amsgrad: false
  sgd:
    lr: 0.0002
    momentum: 0.9
    weight_decay: 0.0005
  sam:
    lr: 0.001
    momentum: 0.9

lr_scheduler: cosine
lr_T_max: 5
lr_eta_min: 0.0000001
nEpochs: 4
start_epoch: 0
validations_per_epoch: 1
save_epoch: 1
rec_iter: 100
logdir: ./logs
manualSeed: 1024

d_update_every: 1
g_adv_weight: 0.1
g_compression_weight: 0.5
g_task_weight: 0.5
band_dropout_prob: 0.1
pert_budget: 0.012
normalize_compression_loss: true
class_weights: [2.0, 0.6]
label_smoothing: 0.05
early_stop_patience: 2
early_stop_min_delta: 0.0003

loss_func: cross_entropy
losstype: null
metric_scoring: auc
cuda: true
cudnn: true

