# Conservative FF++-only domain-generalization fine-tuning.
# The frequency generator and discriminator are frozen. ViT blocks 9-11 use
# a very small LR, while the classification head uses a larger LR.

train_mode: classifier
weights_path: ./logs/training/frepddCg_2026-08-09-22-36-26/val/avg/ckpt_best.pth
validate_before_training: true

pretrained: ./training/pretrained/jx_vit_base_p16_224-80ecf9dd.pth
model_name: frepddCg
backbone_name: vit_base_patch16_224
backbone_train_scope: last_stage
freeze_backbone_bn: true

backbone_config:
  num_classes: 2
  image_size: 224
  dropout: 0.2

all_dataset: [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter, DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC, DeeperForensics-1.0, UADFV]
train_dataset: [FaceForensics++]

# Select checkpoints using the average of two external datasets. DFDC and
# UADFV remain additional held-out checks after training.
val_dataset: [Celeb-DF-v2, Celeb-DF-v1]
test_dataset: [Celeb-DF-v2, Celeb-DF-v1, DFDC, UADFV]
dataset_type: blend
compression: c23
train_batchSize: 8
test_batchSize: 32
workers: 8
frame_num: {train: 8, test: 32}
resolution: 256
with_mask: false
with_landmark: false
save_ckpt: true
save_feat: false

# Strong pipeline perturbations reduce reliance on FF++ codec/camera cues.
use_data_augmentation: true
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.25
  rotate_limit: [-8, 8]
  blur_prob: 0.4
  blur_limit: [3, 7]
  brightness_prob: 0.5
  brightness_limit: [-0.15, 0.15]
  contrast_limit: [-0.15, 0.15]
  color_prob: 0.6
  degradation_prob: 0.75
  scale_min: 0.5
  scale_max: 0.9
  noise_var_limit: [3.0, 20.0]
  quality_lower: 25
  quality_upper: 100
  gamma_prob: 0.2
  gamma_limit: [80, 120]
  grayscale_prob: 0.08

mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]

optimizer:
  type: adam
  adam:
    lr: 0.000001
    lr_d: 0.000001
    lr_c: 0.000001
    lr_head: 0.00001
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0005
    amsgrad: false
  sgd:
    lr: 0.0002
    momentum: 0.9
    weight_decay: 0.0005
  sam:
    lr: 0.001
    momentum: 0.9

lr_scheduler: cosine
lr_T_max: 7
lr_eta_min: 0.0000001
nEpochs: 6
start_epoch: 0
validations_per_epoch: 1
save_epoch: 1
rec_iter: 100
logdir: ./logs
manualSeed: 1024

# These are inactive in classifier mode but retained for model construction.
g_adv_weight: 0.2
g_compression_weight: 0.5
g_task_weight: 0.5
band_dropout_prob: 0.2
pert_budget: 0.02
perturbation_scale: 0.0
normalize_compression_loss: false

class_weights: [2.0, 0.6]
label_smoothing: 0.08
early_stop_patience: 3
early_stop_min_delta: 0.0005

loss_func: cross_entropy
losstype: null
metric_scoring: auc
cuda: true
cudnn: true
task_target: ffpp_classifier_dg
