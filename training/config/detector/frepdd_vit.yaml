# FREPDD with an ImageNet-pretrained ViT-B/16 classifier.

train_mode: all
pretrained: ./training/pretrained/jx_vit_base_p16_224-80ecf9dd.pth
model_name: frepddCg
backbone_name: vit_base_patch16_224
backbone_train_scope: all

backbone_config:
  num_classes: 2
  image_size: 224
  dropout: 0.1

# dataset
all_dataset: [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter, DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC, DeeperForensics-1.0, UADFV]
train_dataset: [FaceForensics++]
val_dataset: [Celeb-DF-v2, Celeb-DF-v1]
test_dataset: [Celeb-DF-v2, Celeb-DF-v1]
dataset_type: blend
compression: c23
train_batchSize: 8
test_batchSize: 32
workers: 8
frame_num: {'train': 8, 'test': 32}
resolution: 256
with_mask: false
with_landmark: false
save_ckpt: true
save_feat: true

# data augmentation
use_data_augmentation: true
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.5
  rotate_limit: [-10, 10]
  blur_prob: 0.5
  blur_limit: [3, 7]
  brightness_prob: 0.5
  brightness_limit: [-0.1, 0.1]
  contrast_limit: [-0.1, 0.1]
  quality_lower: 40
  quality_upper: 100

# mean and std for normalization
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]

# optimizer config
optimizer:
  type: adam
  adam:
    lr: 0.0002
    lr_d: 0.0002
    lr_c: 0.00003
    beta1: 0.5
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0
    amsgrad: false
  sgd:
    lr: 0.0002
    momentum: 0.9
    weight_decay: 0.0005
  sam:
    lr: 0.001
    momentum: 0.9

# training config
lr_scheduler: step
lr_step: 3
lr_gamma: 0.4
nEpochs: 30
start_epoch: 0
validations_per_epoch: 1
save_epoch: 1
rec_iter: 100
logdir: ./logs
manualSeed: 1024
save_ckpt: true

d_update_every: 1
g_adv_weight: 0.5
g_compression_weight: 0.5
g_task_weight: 0.2
band_dropout_prob: 0.2
pert_budget: 0.02
normalize_compression_loss: false
label_smoothing: 0.0
early_stop_patience: 8
early_stop_min_delta: 0.0003

loss_func: cross_entropy
losstype: null
metric_scoring: auc
cuda: true
cudnn: true
