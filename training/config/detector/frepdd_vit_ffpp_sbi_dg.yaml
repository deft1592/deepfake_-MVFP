# FF++-only SBI domain-generalization fine-tuning for Celeb-DF.
# SBI samples are generated online from FF++ real frames and landmarks; no
# Celeb-DF/DFDC/DFDCP/UADFV samples are used for gradient updates.

train_mode: classifier
train_data_strategy: sbi
weights_path: ./logs/training/frepddCg_2026-08-09-22-36-26/val/avg/ckpt_best.pth
validate_before_training: true

pretrained: ./training/pretrained/jx_vit_base_p16_224-80ecf9dd.pth
model_name: frepddCg
backbone_name: vit_base_patch16_224
backbone_train_scope: last_stage
freeze_backbone_bn: true

backbone_config:
  num_classes: 2
  image_size: 224
  dropout: 0.2

all_dataset: [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter, DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC, DeeperForensics-1.0, UADFV]
train_dataset: [FaceForensics++]
val_dataset: [Celeb-DF-v2, Celeb-DF-v1]
test_dataset: [Celeb-DF-v2, Celeb-DF-v1, DFDC, DFDCP, UADFV]
dataset_type: blend
compression: c23
train_batchSize: 64
test_batchSize: 128
workers: 8
frame_num: {train: 8, test: 32}
resolution: 256
with_mask: false
with_landmark: true
save_ckpt: true
save_feat: false

# SBI_API performs the main local blending augmentation. These values remain
# available for compatible paired augmentations and future ablations.
use_data_augmentation: false
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.25
  rotate_limit: [-8, 8]
  blur_prob: 0.3
  blur_limit: [3, 7]
  brightness_prob: 0.5
  brightness_limit: [-0.12, 0.12]
  contrast_limit: [-0.12, 0.12]
  quality_lower: 30
  quality_upper: 100

mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]

# SBI is balanced real/fake. Use conservative discriminative learning rates.
optimizer:
  type: adam
  adam:
    lr: 0.0000005
    lr_d: 0.0000005
    lr_c: 0.0000005
    lr_head: 0.000005
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0005
    amsgrad: false
  sgd:
    lr: 0.0002
    momentum: 0.9
    weight_decay: 0.0005
  sam:
    lr: 0.001
    momentum: 0.9

lr_scheduler: cosine
lr_T_max: 9
lr_eta_min: 0.00000005
nEpochs: 8
start_epoch: 0
validations_per_epoch: 1
save_epoch: 1
rec_iter: 100
logdir: ./logs
manualSeed: 1024

# Generator/discriminator are bypassed and frozen in this experiment.
perturbation_scale: 0.0
g_adv_weight: 0.0
g_compression_weight: 0.0
g_task_weight: 0.0
band_dropout_prob: 0.15
pert_budget: 0.02
normalize_compression_loss: false

label_smoothing: 0.05
early_stop_patience: 4
early_stop_min_delta: 0.0005

loss_func: cross_entropy
losstype: null
metric_scoring: auc
cuda: true
cudnn: true
task_target: ffpp_sbi_dg

